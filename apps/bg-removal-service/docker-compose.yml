services:
  bg-removal-service:
    build: .
    container_name: base-bg-removal-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      REMBG_MODEL: ${REMBG_MODEL:-u2net}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      BG_REMOVAL_API_KEY: ${BG_REMOVAL_API_KEY:?set a shared secret so the internet can't hit this for free}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-21600}
    volumes:
      - bg-removal-data:/app/data

volumes:
  bg-removal-data:
